services:
  tai-course:
    container_name: tai_course

    # No `build:` here, deliberately. With both `build:` and `image:` present,
    # `docker compose up` on a clean machine BUILDS the image instead of
    # pulling it — which is slower, needs a toolchain, and is not the artefact
    # that was tested. Students pull; see compose.dev.yml for building.
    #
    # TAI_TAG comes from .env and is `core` (lessons 1-8). Change it to `full`
    # before lesson 9 to add TensorFlow; only that layer is downloaded.
    image: fabioantonini/technologies-for-artificial-intelligence:${TAI_TAG:-core}

    ports:
      - "8888:8888"
    volumes:
      # The clone is mounted over the snapshot baked into the image, so
      # `git pull` is all a student needs to receive a new lesson.
      - .:/home/jovyan/work
      # Re-owns the course files at start-up, tolerating the files macOS will
      # not let it touch; see the script for why CHOWN_EXTRA is not used.
      - ./Course/Setup/course_ownership.sh:/usr/local/bin/before-notebook.d/20-course-ownership.sh:ro

    # Running as root plus CHOWN_HOME, the course_ownership.sh hook mounted
    # above and the fix-permissions command below is what makes notebooks
    # saveable when the host UID does not match the container's jovyan user.
    # Without it students hit "permission denied" on every save. Do not
    # simplify this away.
    #
    # Until October 2026 the work folder was re-owned with CHOWN_EXTRA and
    # CHOWN_HOME_OPTS=-R. On macOS that stopped the container before Jupyter
    # started: start.sh aborts on the first file it cannot re-own, and Docker
    # Desktop refuses git's read-only objects. The hook does the same work and
    # skips what it cannot touch; fix-permissions is no longer chained with &&
    # for the same reason.
    user: "root"
    environment:
      - JUPYTER_TOKEN=aicourse
      - CHOWN_HOME=yes
      - NOTEBOOK_ARGS=--ServerApp.password='' --ServerApp.allow_origin='*'

    command: bash -c "fix-permissions /home/jovyan/work 2>/dev/null; start-notebook.sh"
