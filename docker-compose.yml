services:
  tai-course:
    container_name: tai_course

    # No `build:` here, deliberately. With both `build:` and `image:` present,
    # `docker compose up` on a clean machine BUILDS the image instead of
    # pulling it — which is slower, needs a toolchain, and is not the artefact
    # that was tested. Students pull; see compose.dev.yml for building.
    #
    # TAI_TAG comes from .env and is `core` (lessons 1-8). Change it to `full`
    # before lesson 9 to add TensorFlow; only that layer is downloaded.
    image: fabioantonini/technologies-for-artificial-intelligence:${TAI_TAG:-core}

    ports:
      - "8888:8888"
    volumes:
      # The clone is mounted over the snapshot baked into the image, so
      # `git pull` is all a student needs to receive a new lesson.
      - .:/home/jovyan/work

    # Running as root plus the CHOWN_* variables and the fix-permissions
    # command below is what makes notebooks saveable when the host UID does
    # not match the container's jovyan user. Without it students hit
    # "permission denied" on every save. Do not simplify this away.
    user: "root"
    environment:
      - JUPYTER_TOKEN=aicourse
      - CHOWN_HOME=yes
      - CHOWN_HOME_OPTS=-R
      - CHOWN_EXTRA=/home/jovyan/work
      - CHOWN_EXTRA_OPTS=-R
      - NOTEBOOK_ARGS=--ServerApp.password='' --ServerApp.allow_origin='*'

    command: bash -c "fix-permissions /home/jovyan/work && start-notebook.sh"
